name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # One test reads the repository history, so a shallow clone is not enough.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux CLI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq whiptail shellcheck nmap
      - run: pip install -r requirements.txt pytest pyyaml
      - run: make check
      - run: python -m pytest -q

  linux-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: pip install pytest
      - name: Solve ownership and discovery exercises in real Docker containers
        env:
          MFANO_TEST_DOCKER: "1"
        run: python -m pytest -q tests/test_linux_ownership.py tests/test_linux_discovery.py

  nmap-enumeration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y jq nmap
      - run: pip install pytest pyyaml
      - name: Solve every Nmap exercise against real isolated services
        env:
          MFANO_TEST_NMAP: "1"
        run: python -m pytest -q tests/test_nmap_enumeration.py
