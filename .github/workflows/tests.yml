name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # One test reads the repository history, so a shallow clone is not enough.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux CLI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq whiptail shellcheck
      - run: pip install -r requirements.txt pytest
      - run: make check
      - run: python -m pytest -q
