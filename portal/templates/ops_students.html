<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ops console</title>
  <style>
    body { font-family: monospace; margin: 2rem; color: #111; }
    h1 { color: #991b1b; }
    .banner { background: #fee2e2; border: 1px solid #fca5a5; padding: .8rem; margin-bottom: 1rem; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: .3rem .6rem; }
  </style>
</head>
<body>
  <h1>Legacy ops console</h1>
  <div class="banner">
    DEPRECATED internal tool. Do not expose. Console access token: <strong>{{ token }}</strong>
  </div>
  <table>
    <thead><tr><th>Admission</th><th>Name</th><th>Class</th><th>Fee balance</th></tr></thead>
    <tbody>
      {% for r in rows %}
      <tr><td>{{ r.admission }}</td><td>{{ r.full_name }}</td><td>{{ r.form }} {{ r.stream }}</td><td>{{ r.fee_balance }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
