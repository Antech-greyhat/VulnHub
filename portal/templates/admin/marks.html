{% extends "base.html" %}
{% block title %}Marks · Mfano High School{% endblock %}
{% block content %}
<h1>Marks</h1>
<section class="card">
  <table>
    <thead><tr><th>Admission</th><th>Name</th><th>Subject</th><th>Term</th><th>Score</th></tr></thead>
    <tbody>
      {% for r in rows %}
      <tr><td>{{ r.admission }}</td><td>{{ r.full_name }}</td><td>{{ r.subject }}</td><td>{{ r.term }}</td><td>{{ r.score }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
