services:
  scanner:
    image: ${MFANO_NMAP_SCANNER_IMAGE:-mfano-nmap-scanner:local}
    depends_on:
      target:
        condition: service_healthy
      archive:
        condition: service_healthy
    networks:
      practice:
        ipv4_address: 172.30.77.2
    volumes:
      - scans:/practice/scans
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0

  target:
    image: ${MFANO_NMAP_TARGET_IMAGE:-mfano-nmap-target:local}
    networks:
      practice:
        ipv4_address: 172.30.77.10
    read_only: true
    tmpfs: [/run, /tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, SYS_CHROOT]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: [CMD, python3, -B, /opt/mfano/target.py, health, portal]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  archive:
    image: ${MFANO_NMAP_TARGET_IMAGE:-mfano-nmap-target:local}
    command: [python3, -B, /opt/mfano/target.py, archive]
    networks:
      practice:
        ipv4_address: 172.30.77.11
    read_only: true
    tmpfs: [/run, /tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 1.0
    healthcheck:
      test: [CMD, python3, -B, /opt/mfano/target.py, health, archive]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

networks:
  practice:
    internal: true
    ipam:
      config:
        - subnet: 172.30.77.0/28

volumes:
  scans:
