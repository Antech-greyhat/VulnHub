    <path d="m69 23 908-4q15 0 18 15l18 194q2 17-15 18l-944 5q-14 0-13-13L53 42q2-15 16-19z" fill="#e8dbb9"/>
    <path d="M71 31 970 27" fill="none" stroke="#fff5d8" stroke-width="4" stroke-linecap="round"/>
    <path d="M82 40q-13 1-16 17l-7 163q-1 12 13 14l695-3q13-1 13-13l-5-164q-1-14-15-15z" fill="#7d8673"/>
    <path d="M96 49q-14 1-15 15l-6 144q0 13 13 14l661-2q15 0 15-13l-4-145q-1-13-15-14z" fill="url(#phosphor)"/>
  </g>
  <path d="M93 52h648q14 0 16 14l4 137q0 15-15 15l-654 2q-14 0-14-13l6-141q0-11 9-14z" fill="url(#scanlines)"/>

  <g font-family="'IBM Plex Mono','Liberation Mono',monospace">
    <text x="105" y="81" fill="#acd1a1" font-size="18">$ ./labctl tracks</text>
    <text x="103" y="131" fill="#e6ffc1" font-size="47" font-weight="700">4NT3CH VULN3R4BL3 L4B</text>
    <text x="105" y="162" fill="#c2e3b1" font-size="23">A deliberately vulnerable CTF machine</text>
    <g fill="#add2a6" font-size="17">
      <text x="106" y="190">Web · Linux · Networking · Cryptography</text>
      <text x="106" y="211">OSINT · Forensics · Steganography</text>
    </g>
  </g>

  <!-- Inventory plate, disk drive and the physical power switch. -->
