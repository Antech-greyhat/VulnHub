<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="340" viewBox="0 0 1080 340" role="img" aria-labelledby="title description">
  <title id="title">4NT3CH VULN3R4BL3 L4B</title>
  <desc id="description">A cream-coloured school computer with the lab name glowing on its green screen. This deliberately vulnerable CTF machine offers web, Linux, networking, cryptography, OSINT, forensics and steganography challenges.</desc>
  <defs>
    <radialGradient id="phosphor" cx="38%" cy="35%" r="83%">
      <stop stop-color="#1c4436"/><stop offset="1" stop-color="#0b211c"/>
    </radialGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5h4" stroke="#93b89b" stroke-opacity=".12"/>
    </pattern>
    <pattern id="keys" width="34" height="13" patternUnits="userSpaceOnUse">
      <rect x="2" y="1" width="28" height="9" rx="2" fill="#c6bea2" stroke="#3f5148" stroke-width="1.5"/>
      <path d="M6 3h19" stroke="#fff3d1"/>
    </pattern>
    <pattern id="vents" width="9" height="22" patternUnits="userSpaceOnUse">
      <path d="M2 3v15" stroke="#485650" stroke-width="3.5" stroke-linecap="round"/>
    </pattern>
  </defs>

  <!-- Moulded case, recessed CRT and the two-tone keyboard deck. -->
  <rect width="1080" height="340" rx="14" fill="#264341"/>
  <path d="M46 302 74 275l938-8 48 39-15 17-990 6z" fill="#172d2c"/>
  <g stroke="#23342e" stroke-width="3" stroke-linejoin="round">
